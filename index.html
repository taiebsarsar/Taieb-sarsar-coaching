<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Coach Sarsar Taieb</title>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-title' content='Coach Sarsar Taieb'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='theme-color' content='#000000'>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<style>
 :root { --or: #d4af37; --or-clair: #f0d77a; --noir: #000; --gris: #141414; --gris2: #1f1f1f; --texte: #f5f1e6; }
 * { -webkit-tap-highlight-color: transparent; }
 body { font-family: Georgia, 'Times New Roman', serif; margin: 0; background: var(--noir); color: var(--texte); padding-bottom: env(safe-area-inset-bottom); }
 header { background: linear-gradient(180deg, #000 0%, #111 100%); color: var(--or); padding: calc(16px + env(safe-area-inset-top)) 16px 16px 16px; font-size: 20px; letter-spacing: 1px; text-align: center; position: relative; border-bottom: 2px solid var(--or); }
 #deconnexion { position: absolute; right: 10px; bottom: 12px; background: transparent; color: var(--or); border: 1px solid var(--or); padding: 6px 10px; font-size: 13px; border-radius: 8px; margin: 0; }
 main { padding: 12px; max-width: 600px; margin: auto; }
 .carte { background: var(--gris); border: 1px solid #3a3320; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
 .carte h3 { margin: 0 0 6px 0; color: var(--or); }
 .reste { font-size: 26px; font-weight: bold; color: var(--or-clair); }
 .reste.vide { color: #ff6b6b; }
 .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; margin: 6px 0; }
 .paye { background: #12351f; color: #5be08a; border: 1px solid #5be08a; }
 .nonpaye { background: #3a1414; color: #ff7a7a; border: 1px solid #ff7a7a; }
 .partiel { background: #3a3010; color: #f0d77a; border: 1px solid #f0d77a; }
 .neutre { background: #222; color: #bdb59a; border: 1px solid #6b6450; }
 .compte { margin: 10px 0 4px 0; border-top: 1px solid #3a3320; padding-top: 8px; }
 .ligne { display: flex; justify-content: space-between; padding: 3px 0; font-size: 16px; }
 .solde { font-weight: bold; font-size: 20px; }
 .solde.du { color: #ff7a7a; }
 .solde.ok { color: #5be08a; }
 .credit { color: #f0d77a; font-size: 14px; }
 details summary { cursor: pointer; color: var(--or); margin-top: 8px; }
 input[type=text], input[type=email], input[type=password], input[type=datetime-local], select { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #4a4128; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: var(--gris2); color: var(--texte); }
 button { padding: 12px 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 4px 4px 0 0; font-family: inherit; }
 .principal { background: var(--or); color: #000; font-weight: bold; }
 .pointer { background: #2da44e; color: white; }
 .secondaire { background: #2a2a2a; color: var(--texte); border: 1px solid #4a4128; }
 .danger { background: #3a1414; color: #ff7a7a; border: 1px solid #ff7a7a; }
 .cache { display: none; }
 .erreur { color: #ff7a7a; margin: 6px 0; }
 ul { padding-left: 18px; margin: 8px 0 0 0; font-size: 14px; color: #bdb59a; }
 h2 { margin: 18px 0 8px 0; font-size: 18px; color: var(--or); }
 .vide-msg { text-align: center; color: #8d866f; }
 .orange { background: #ff7a00; color: #000; font-weight: bold; }
 .courbe svg { width: 100%; height: auto; display: block; margin-top: 8px; }
 .gain { color: #ff9d2e; font-weight: bold; font-size: 17px; margin-top: 6px; text-align: center; }
 .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
 .stat { background: var(--gris2); border: 1px solid #4a4128; border-radius: 10px; padding: 10px; text-align: center; }
 .stat b { display: block; font-size: 20px; color: #ff9d2e; }
 .stat span { font-size: 13px; color: #bdb59a; }
 table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
 table.rec td, table.rec th { padding: 6px 4px; border-bottom: 1px solid #2a2a2a; text-align: right; }
 table.rec td:first-child, table.rec th:first-child { text-align: left; }
 table.rec th { color: var(--or); font-weight: normal; }
 .saisie { border-top: 1px solid #3a3320; margin-top: 10px; padding-top: 8px; }
</style>
</head>
<body>
<header>Coach Sarsar Taieb<button id='deconnexion' class='cache' onclick='seDeconnecter()'>Quitter</button></header>
<main>

 <div id='ecranConnexion' class='carte'>
  <h3>Connexion</h3>
  <input type='email' id='email' placeholder='Ton e-mail' autocomplete='email'>
  <input type='password' id='mdp' placeholder='Mot de passe' autocomplete='current-password'>
  <div id='messageConnexion' class='erreur'></div>
  <button class='principal' onclick='seConnecter()'>Se connecter</button>
  <button class='secondaire' onclick='creerCompte()'>Créer mon compte</button>
 </div>

 <div id='espaceClient' class='cache'></div>

 <div id='espaceCoach' class='cache'>
  <div class='carte'>
   <h3>Nouveau rendez-vous</h3>
   <select id='rdvClient'></select>
   <input type='datetime-local' id='rdvDate'>
   <button class='principal' onclick='ajouterRdv()'>Planifier</button>
  </div>
  <button class='orange' style='width:100%;margin:0 0 12px 0' data-z='zoneStats' onclick='basculer(this.dataset.z)'>Mes statistiques</button>
  <div id='zoneStats' class='cache'></div>
  <h2>Demandes en attente</h2>
  <div id='listeDemandes'></div>
  <h2>Rendez-vous à venir</h2>
  <div id='listeRdv'></div>
  <h2>Clients</h2>
  <div id='listeClients'></div>
 </div>

</main>

<script>
 const SUPABASE_URL = 'https://tfpaycxwubwfyqscpzeq.supabase.co';
 const SUPABASE_CLE = 'sb_publishable_vwNP6G6cL9Wh3fwpJBNylQ_OJJzCs-5';

 const TAILLE_PACK = 12;
 const EXERCICES = ['Squat', 'Presse à cuisses', 'Fentes', 'Soulevé de terre', 'Soulevé de terre roumain', 'Hip thrust', 'Leg extension', 'Leg curl', 'Mollets debout', 'Développé couché', 'Développé incliné', 'Développé militaire', 'Élévations latérales', 'Dips lestés', 'Tirage vertical', 'Tractions lestées', 'Rowing barre', 'Tirage horizontal', 'Curl biceps', 'Extensions triceps'];
 let PROG = {};
 const sb = supabase.createClient(SUPABASE_URL, SUPABASE_CLE);

 function montrer(id, oui) { document.getElementById(id).classList.toggle('cache', !oui); }
 function dateFr(d, long) {
  return new Date(d).toLocaleString('fr-FR', long ? { dateStyle: 'full', timeStyle: 'short' } : undefined);
 }
 function esc(t) {
  return String(t == null ? '' : t).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split(String.fromCharCode(34)).join('&quot;').split(String.fromCharCode(39)).join('&#39;');
 }
 function nombre(x) { return Number(x) || 0; }
 function dt(x) { return (Math.round(nombre(x) * 1000) / 1000).toString().replace('.', ',') + ' DT'; }
 function lireMontant(texte) {
  if (texte === null) return null;
  const n = parseFloat(String(texte).split(' ').join('').replace(',', '.'));
  if (isNaN(n)) { alert('Montant invalide.'); return null; }
  return n;
 }
 function erreur(res) {
  if (res && res.error) { alert('Erreur : ' + res.error.message); return true; }
  return false;
 }

 function compte(profil, versements) {
  const du = nombre(profil.total_du);
  const verse = (versements || []).reduce((s, p) => s + nombre(p.montant), 0);
  const solde = du - verse;
  let statut = { classe: 'nonpaye', texte: 'Non payé' };
  if (du <= 0) statut = verse > 0 ? { classe: 'partiel', texte: 'Avance versée' } : { classe: 'neutre', texte: 'Prix non défini' };
  else if (solde <= 0.0005) statut = { classe: 'paye', texte: 'Payé' };
  else if (verse > 0) statut = { classe: 'partiel', texte: 'Avance versée' };
  return { du: du, verse: verse, reste: Math.max(0, solde), credit: Math.max(0, -solde), statut: statut };
 }

 function blocCompte(profil, versements) {
  const k = compte(profil, versements);
  const lignes = (versements || []).slice().sort((a, b) => b.date_paiement.localeCompare(a.date_paiement));
  return `
   <span class='badge ${k.statut.classe}'>${k.statut.texte}</span>
   <div class='compte'>
    <div class='ligne'><span>Total dû</span><span>${dt(k.du)}</span></div>
    <div class='ligne'><span>Déjà versé</span><span>${dt(k.verse)}</span></div>
    <div class='ligne solde ${k.reste > 0 ? 'du' : 'ok'}'><span>Reste à payer</span><span>${dt(k.reste)}</span></div>
    ${k.credit > 0 ? '<div class="credit">Avance déjà versée pour le prochain pack : ' + dt(k.credit) + '</div>' : ''}
   </div>
   <details><summary>Versements (${lignes.length})</summary>
    <ul>${lignes.length ? lignes.map(p => '<li>' + dateFr(p.date_paiement) + ' : ' + dt(p.montant) + '</li>').join('') : '<li>Aucun versement.</li>'}</ul>
   </details>`;
 }

 function basculer(id) { document.getElementById(id).classList.toggle('cache'); }
 function kg(x) { return (Math.round(nombre(x) * 10) / 10).toString().replace('.', ',') + ' kg'; }
 function dateCourte(d) { return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
 function groupeProgression(lignes) {
  const g = {};
  (lignes || []).forEach(l => { (g[l.client_id] = g[l.client_id] || []).push(l); });
  return g;
 }

 function courbeSvg(pts) {
  if (!pts.length) return '';
  const W = 320, H = 210, gauche = 46, droite = 16, haut = 28, bas = 34;
  const vals = pts.map(p => nombre(p.charge));
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { min -= 1; max += 1; }
  const marge = (max - min) * 0.15;
  min = Math.max(0, min - marge); max = max + marge;
  const n = pts.length;
  const x = i => n === 1 ? gauche + (W - gauche - droite) / 2 : gauche + i * (W - gauche - droite) / (n - 1);
  const y = v => haut + (max - v) * (H - haut - bas) / (max - min);
  const ligne = pts.map((p, i) => x(i).toFixed(1) + ',' + y(vals[i]).toFixed(1)).join(' ');
  const base = H - bas;
  const aire = n > 1 ? 'M' + x(0).toFixed(1) + ',' + base + ' L' + ligne.split(' ').join(' L') + ' L' + x(n - 1).toFixed(1) + ',' + base + ' Z' : '';
  const grille = [min, (min + max) / 2, max].map(v =>
   "<line x1='" + gauche + "' x2='" + (W - droite) + "' y1='" + y(v).toFixed(1) + "' y2='" + y(v).toFixed(1) + "' stroke='#3a3320' stroke-width='1'/>" +
   "<text x='" + (gauche - 6) + "' y='" + (y(v) + 4).toFixed(1) + "' fill='#bdb59a' font-size='11' text-anchor='end'>" + (Math.round(v * 10) / 10) + "</text>").join('');
  const points = pts.map((p, i) =>
   "<circle cx='" + x(i).toFixed(1) + "' cy='" + y(vals[i]).toFixed(1) + "' r='5' fill='#ffb347' stroke='#ff7a00' stroke-width='3'/>" +
   ((n <= 8 || i === n - 1) ? "<text x='" + x(i).toFixed(1) + "' y='" + (y(vals[i]) - 11).toFixed(1) + "' fill='#ffd9a0' font-size='12' font-weight='bold' text-anchor='middle'>" + (Math.round(vals[i] * 10) / 10) + "</text>" : '')).join('');
  const dates = n === 1
   ? "<text x='" + x(0).toFixed(1) + "' y='" + (H - 10) + "' fill='#bdb59a' font-size='11' text-anchor='middle'>" + dateCourte(pts[0].date_seance) + "</text>"
   : "<text x='" + gauche + "' y='" + (H - 10) + "' fill='#bdb59a' font-size='11' text-anchor='start'>" + dateCourte(pts[0].date_seance) + "</text>" +
    "<text x='" + (W - droite) + "' y='" + (H - 10) + "' fill='#bdb59a' font-size='11' text-anchor='end'>" + dateCourte(pts[n - 1].date_seance) + "</text>";
  const diff = vals[n - 1] - vals[0];
  let message;
  if (n === 1) message = 'Premier enregistrement : ' + kg(vals[0]) + '. C’est parti ! 🔥';
  else if (diff > 0) message = '+' + kg(diff) + ' depuis le début. Continue comme ça ! 💪';
  else if (diff === 0) message = 'Charge stable : ' + kg(vals[n - 1]) + '. Tu tiens la cadence !';
  else message = 'Charge actuelle : ' + kg(vals[n - 1]) + '. On remonte ensemble !';
  return "<svg viewBox='0 0 " + W + " " + H + "' xmlns='http://www.w3.org/2000/svg'>" +
   "<defs><linearGradient id='gOr' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ff7a00' stop-opacity='0.55'/><stop offset='1' stop-color='#ff7a00' stop-opacity='0'/></linearGradient></defs>" +
   grille +
   (n > 1 ? "<path d='" + aire + "' fill='url(#gOr)'/><polyline points='" + ligne + "' fill='none' stroke='#ff7a00' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/>" : '') +
   points + dates + "</svg><div class='gain'>" + message + "</div>";
 }

 function majCourbe(sel) {
  const pts = (PROG[sel.dataset.id] || []).filter(l => l.exercice === sel.value).sort((a, b) => a.date_seance.localeCompare(b.date_seance));
  sel.parentNode.querySelector('.courbe').innerHTML = courbeSvg(pts);
 }
 function majToutesCourbes() { document.querySelectorAll('.selprog').forEach(s => majCourbe(s)); }

 function blocProgression(clientId, lignes) {
  const exs = EXERCICES.filter(e => (lignes || []).some(l => l.exercice === e));
  if (!exs.length) return "<p class='vide-msg'>Aucune charge enregistrée pour le moment.</p>";
  return `<div class='carte'>
   <select class='selprog' data-id='${clientId}' onchange='majCourbe(this)'>${exs.map(e => `<option value='${esc(e)}'>${esc(e)}</option>`).join('')}</select>
   <div class='courbe'></div>
  </div>`;
 }

 function cleJour(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
 function debutSemaine(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
 function resumeStats(pointages, maintenant) {
  const now = maintenant || new Date();
  const auj = cleJour(now);
  const sem = debutSemaine(now).getTime();
  const mois = now.getFullYear() * 12 + now.getMonth();
  const r = { jour: [0, 0], semaine: [0, 0], mois: [0, 0], total: [0, 0] };
  const parJour = {}, parSemaine = {}, parMois = {};
  (pointages || []).forEach(p => {
   const d = new Date(p.date_pointage), v = nombre(p.prix);
   const add = (o, k) => { o[k] = o[k] || [0, 0]; o[k][0] += 1; o[k][1] += v; };
   r.total[0] += 1; r.total[1] += v;
   if (cleJour(d) === auj) { r.jour[0] += 1; r.jour[1] += v; }
   if (debutSemaine(d).getTime() === sem) { r.semaine[0] += 1; r.semaine[1] += v; }
   if (d.getFullYear() * 12 + d.getMonth() === mois) { r.mois[0] += 1; r.mois[1] += v; }
   add(parJour, cleJour(d)); add(parSemaine, debutSemaine(d).getTime()); add(parMois, d.getFullYear() * 12 + d.getMonth());
  });
  r.parJour = parJour; r.parSemaine = parSemaine; r.parMois = parMois;
  return r;
 }
 function blocStats(pointages) {
  const r = resumeStats(pointages);
  const carte = (titre, v) => "<div class='stat'><span>" + titre + "</span><b>" + dt(v[1]) + "</b><span>" + v[0] + " séance(s)</span></div>";
  const jours = Object.keys(r.parJour).sort().reverse().slice(0, 14);
  const semaines = Object.keys(r.parSemaine).map(Number).sort((a, b) => b - a).slice(0, 8);
  const moisL = Object.keys(r.parMois).map(Number).sort((a, b) => b - a).slice(0, 12);
  const ligne = (nom, v) => '<tr><td>' + nom + '</td><td>' + v[0] + '</td><td>' + dt(v[1]) + '</td></tr>';
  const tableau = (titre, lignes) => '<details><summary>' + titre + '</summary><table class="rec"><tr><th></th><th>Séances</th><th>Gagné</th></tr>' + (lignes.join('') || '<tr><td colspan="3">Aucune séance.</td></tr>') + '</table></details>';
  return "<div class='carte'><h3>Mes statistiques</h3>" +
   "<div class='stats'>" + carte("Aujourd’hui", r.jour) + carte("Cette semaine", r.semaine) + carte("Ce mois", r.mois) + carte("Depuis le début", r.total) + "</div>" +
   tableau('Par jour (14 derniers jours)', jours.map(k => ligne(new Date(k + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }), r.parJour[k]))) +
   tableau('Par semaine (8 dernières)', semaines.map(k => ligne('Semaine du ' + new Date(k).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }), r.parSemaine[k]))) +
   tableau('Par mois (12 derniers)', moisL.map(k => ligne(new Date(Math.floor(k / 12), k % 12, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }), r.parMois[k]))) +
   "<p class='vide-msg' style='font-size:13px'>Valeur d’une séance = prix du pack ÷ 12, figé au moment du pointage.</p></div>";
 }

 async function seConnecter() {
  const email = document.getElementById('email').value.trim();
  const mdp = document.getElementById('mdp').value;
  document.getElementById('messageConnexion').textContent = 'Connexion en cours...';
  const { error } = await sb.auth.signInWithPassword({ email: email, password: mdp });
  if (error) { document.getElementById('messageConnexion').textContent = 'Connexion impossible : ' + error.message; return; }
  document.getElementById('messageConnexion').textContent = '';
  demarrer();
 }

 async function creerCompte() {
  const email = document.getElementById('email').value.trim();
  const mdp = document.getElementById('mdp').value;
  if (!email || mdp.length < 6) { document.getElementById('messageConnexion').textContent = 'Entre un e-mail et un mot de passe de 6 caractères minimum.'; return; }
  const { error } = await sb.auth.signUp({ email: email, password: mdp });
  if (error) { document.getElementById('messageConnexion').textContent = 'Création impossible : ' + error.message; return; }
  document.getElementById('messageConnexion').textContent = '';
  seConnecter();
 }

 async function seDeconnecter() {
  await sb.auth.signOut();
  montrer('ecranConnexion', true);
  montrer('espaceClient', false);
  montrer('espaceCoach', false);
  montrer('deconnexion', false);
 }

 async function demarrer() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data: profil } = await sb.from('profils').select('*').eq('id', user.id).single();
  if (!profil) { alert('Profil introuvable.'); return; }
  montrer('ecranConnexion', false);
  montrer('deconnexion', true);
  if (profil.role === 'coach') {
   montrer('espaceCoach', true);
   montrer('espaceClient', false);
   afficherCoach();
  } else {
   montrer('espaceClient', true);
   montrer('espaceCoach', false);
   afficherClient(profil);
  }
 }

 async function afficherClient(profil) {
  const { data: rdvs } = await sb.from('rendez_vous').select('*').eq('client_id', profil.id).eq('fait', false).order('date_rdv');
  const { data: points } = await sb.from('pointages').select('*').eq('client_id', profil.id).order('date_pointage', { ascending: false });
  const { data: versements } = await sb.from('paiements').select('*').eq('client_id', profil.id);
  const { data: demandes } = await sb.from('demandes_rdv').select('*').eq('client_id', profil.id).order('date_demandee', { ascending: false }).limit(10);
  const { data: prog } = await sb.from('progression').select('*').eq('client_id', profil.id);
  PROG = groupeProgression(prog);
  const etat = { attente: ['partiel', 'En attente'], accepte: ['paye', 'Accepté'], refuse: ['nonpaye', 'Refusé'] };
  document.getElementById('espaceClient').innerHTML = `
   <div class='carte'>
    <h3>Bonjour ${esc(profil.nom || profil.email)}</h3>
    <div class='reste ${profil.seances_restantes === 0 ? 'vide' : ''}'>${profil.seances_restantes} séance(s) restante(s)</div>
    ${blocCompte(profil, versements)}
   </div>
   <button class='orange' style='width:100%;margin:0 0 12px 0' data-z='zoneProgression' onclick='basculer(this.dataset.z)'>Ma progression</button>
   <div id='zoneProgression' class='cache'>${blocProgression(profil.id, PROG[profil.id])}</div>
   <h2>Demander un rendez-vous</h2>
   <div class='carte'>
    <input type='datetime-local' id='demandeDate'>
    <button class='principal' onclick='demanderRdv()'>Envoyer ma demande</button>
    ${(demandes && demandes.length) ? '<ul>' + demandes.map(d => '<li>' + dateFr(d.date_demandee, true) + ' <span class="badge ' + etat[d.statut][0] + '">' + etat[d.statut][1] + '</span></li>').join('') + '</ul>' : ''}
   </div>
   <h2>Mes prochains rendez-vous</h2>
   ${(rdvs && rdvs.length) ? rdvs.map(r => '<div class="carte">' + dateFr(r.date_rdv, true) + '</div>').join('') : '<p class="vide-msg">Aucun rendez-vous prévu.</p>'}
   <h2>Mes séances effectuées</h2>
   <div class='carte'><ul>${(points && points.length) ? points.map(p => '<li>' + dateFr(p.date_pointage) + '</li>').join('') : '<li>Aucune séance pour le moment.</li>'}</ul></div>`;
  majToutesCourbes();
 }

 async function afficherCoach() {
  const { data: clients } = await sb.from('profils').select('*').eq('role', 'client');
  const { data: rdvs } = await sb.from('rendez_vous').select('*').eq('fait', false).order('date_rdv');
  const { data: versements } = await sb.from('paiements').select('*');
  const { data: demandes } = await sb.from('demandes_rdv').select('*').eq('statut', 'attente').order('date_demandee');
  const { data: prog } = await sb.from('progression').select('*');
  PROG = groupeProgression(prog);
  const { data: tousPointages } = await sb.from('pointages').select('*');
  document.getElementById('zoneStats').innerHTML = blocStats(tousPointages);
  const optionsEx = EXERCICES.map(e => `<option value='${esc(e)}'>${esc(e)}</option>`).join('');
  const liste = (clients || []).slice().sort((a, b) => String(a.nom || a.email || '').toLowerCase().localeCompare(String(b.nom || b.email || '').toLowerCase(), 'fr') || String(a.id).localeCompare(String(b.id)));

  document.getElementById('rdvClient').innerHTML = liste.map(c => '<option value="' + c.id + '">' + esc(c.nom || c.email) + '</option>').join('');

  const nom = id => { const c = liste.find(x => x.id === id); return c ? esc(c.nom || c.email) : 'Client inconnu'; };
  document.getElementById('listeDemandes').innerHTML = (demandes && demandes.length) ? demandes.map(d => `
   <div class='carte'>
    <h3>${nom(d.client_id)}</h3>
    <div>${dateFr(d.date_demandee, true)}</div>
    <button class='pointer' data-d='${d.id}' onclick='accepterDemande(this.dataset.d)'>Accepter</button>
    <button class='danger' data-d='${d.id}' onclick='refuserDemande(this.dataset.d)'>Refuser</button>
   </div>`).join('') : '<p class="vide-msg">Aucune demande en attente.</p>';

  document.getElementById('listeRdv').innerHTML = (rdvs && rdvs.length) ? rdvs.map(r => `
   <div class='carte'>
    <h3>${nom(r.client_id)}</h3>
    <div>${dateFr(r.date_rdv, true)}</div>
    <button class='pointer' data-r='${r.id}' data-id='${r.client_id}' onclick='rdvFait(this.dataset.r, this.dataset.id)'>Séance faite (pointer)</button>
    <button class='danger' data-r='${r.id}' onclick='annulerRdv(this.dataset.r)'>Annuler</button>
   </div>`).join('') : '<p class="vide-msg">Aucun rendez-vous.</p>';

  document.getElementById('listeClients').innerHTML = liste.length ? liste.map(c => `
   <div class='carte'>
    <h3>${esc(c.nom || c.email)}</h3>
    <div>${esc(c.email)}</div>
    <div class='reste ${c.seances_restantes === 0 ? 'vide' : ''}'>${c.seances_restantes} séance(s) restante(s)</div>
    ${blocCompte(c, (versements || []).filter(p => p.client_id === c.id))}
    <details><summary>Progression (charges)</summary>${blocProgression(c.id, PROG[c.id])}</details>
    <div class='saisie'>
     <select>${optionsEx}</select>
     <input type='text' placeholder='Charge en kg' inputmode='decimal'>
     <button class='orange' data-id='${c.id}' onclick='noterCharge(this)'>Noter la charge</button>
     <button class='secondaire' data-id='${c.id}' onclick='annulerCharge(this.dataset.id)'>Annuler la dernière charge</button>
    </div>
    <button class='pointer' data-id='${c.id}' onclick='pointer(this.dataset.id)'>Pointer une séance</button>
    <button class='secondaire' data-id='${c.id}' onclick='annulerPointage(this.dataset.id)'>Annuler la dernière</button>
    <button class='principal' data-id='${c.id}' onclick='ajouterVersement(this.dataset.id)'>Ajouter un versement</button>
    <button class='secondaire' data-id='${c.id}' onclick='annulerVersement(this.dataset.id)'>Annuler le dernier versement</button>
    <button class='principal' data-id='${c.id}' onclick='renouveler(this.dataset.id)'>Nouveau pack de 12</button>
    <button class='secondaire' data-id='${c.id}' onclick='ajouterPrix(this.dataset.id)'>Prix du pack en cours</button>
    <button class='secondaire' data-id='${c.id}' onclick='corrigerTotal(this.dataset.id)'>Corriger le total dû</button>
    <button class='secondaire' data-id='${c.id}' onclick='renommer(this.dataset.id)'>Changer le nom</button>
   </div>`).join('') : '<p class="vide-msg">Aucun client pour le moment. Tes clients doivent créer leur compte depuis la page de connexion.</p>';
  majToutesCourbes();
 }

 async function noterCharge(bouton) {
  const zone = bouton.parentNode;
  const exercice = zone.querySelector('select').value;
  const v = lireMontant(zone.querySelector('input').value);
  if (v === null) return;
  if (!(v > 0)) { alert('La charge doit être supérieure à zéro.'); return; }
  if (erreur(await sb.from('progression').insert({ client_id: bouton.dataset.id, exercice: exercice, charge: v }))) return;
  afficherCoach();
 }

 async function annulerCharge(id) {
  const { data: derniere } = await sb.from('progression').select('*').eq('client_id', id).order('date_seance', { ascending: false }).limit(1);
  if (!derniere || derniere.length === 0) { alert('Aucune charge à annuler.'); return; }
  if (!confirm('Annuler la dernière charge : ' + derniere[0].exercice + ', ' + kg(derniere[0].charge) + ' ?')) return;
  if (erreur(await sb.from('progression').delete().eq('id', derniere[0].id))) return;
  afficherCoach();
 }

 async function ajouterVersement(id) {
  const m = lireMontant(prompt('Montant du versement, en dinars (DT) :'));
  if (m === null) return;
  if (!(m > 0)) { alert('Le montant doit être supérieur à zéro.'); return; }
  if (erreur(await sb.from('paiements').insert({ client_id: id, montant: m }))) return;
  afficherCoach();
 }

 async function annulerVersement(id) {
  const { data: dernier } = await sb.from('paiements').select('*').eq('client_id', id).order('date_paiement', { ascending: false }).limit(1);
  if (!dernier || dernier.length === 0) { alert('Aucun versement à annuler.'); return; }
  if (!confirm('Annuler le dernier versement de ' + dt(dernier[0].montant) + ' ?')) return;
  if (erreur(await sb.from('paiements').delete().eq('id', dernier[0].id))) return;
  afficherCoach();
 }

 async function renouveler(id) {
  const prix = lireMontant(prompt('Prix de ce nouveau pack de ' + TAILLE_PACK + ' séances, en dinars (DT) :'));
  if (prix === null) return;
  if (prix < 0) { alert('Le prix ne peut pas être négatif.'); return; }
  const { data: c } = await sb.from('profils').select('seances_restantes, total_du, packs').eq('id', id).single();
  if (erreur(await sb.from('profils').update({ seances_restantes: c.seances_restantes + TAILLE_PACK, total_du: nombre(c.total_du) + prix, packs: Math.max(1, nombre(c.packs)) + 1 }).eq('id', id))) return;
  afficherCoach();
 }

 async function ajouterPrix(id) {
  const prix = lireMontant(prompt('Prix du pack en cours, en dinars (DT) :'));
  if (prix === null) return;
  if (prix < 0) { alert('Le prix ne peut pas être négatif.'); return; }
  const { data: c } = await sb.from('profils').select('total_du').eq('id', id).single();
  if (erreur(await sb.from('profils').update({ total_du: nombre(c.total_du) + prix }).eq('id', id))) return;
  afficherCoach();
 }

 async function corrigerTotal(id) {
  const { data: c } = await sb.from('profils').select('total_du').eq('id', id).single();
  const n = lireMontant(prompt('Nouveau total dû, en dinars (DT) :', String(nombre(c.total_du))));
  if (n === null) return;
  if (n < 0) { alert('Le total ne peut pas être négatif.'); return; }
  if (erreur(await sb.from('profils').update({ total_du: n }).eq('id', id))) return;
  afficherCoach();
 }

 async function pointer(id) {
  const { data: c } = await sb.from('profils').select('seances_restantes, total_du, packs').eq('id', id).single();
  if (c.seances_restantes <= 0) { alert('Plus de séances dans ce pack.'); return; }
  const nbPacks = Math.max(1, nombre(c.packs));
  const prixSeance = nombre(c.total_du) / (nbPacks * TAILLE_PACK);
  await sb.from('profils').update({ seances_restantes: c.seances_restantes - 1 }).eq('id', id);
  await sb.from('pointages').insert({ client_id: id, prix: prixSeance });
  afficherCoach();
 }

 async function annulerPointage(id) {
  const { data: dernier } = await sb.from('pointages').select('id').eq('client_id', id).order('date_pointage', { ascending: false }).limit(1);
  if (!dernier || dernier.length === 0) { alert('Aucun pointage à annuler.'); return; }
  const { data: c } = await sb.from('profils').select('seances_restantes').eq('id', id).single();
  await sb.from('pointages').delete().eq('id', dernier[0].id);
  await sb.from('profils').update({ seances_restantes: c.seances_restantes + 1 }).eq('id', id);
  afficherCoach();
 }

 async function renommer(id) {
  const nom = prompt('Nom du client :');
  if (!nom) return;
  await sb.from('profils').update({ nom: nom.trim() }).eq('id', id);
  afficherCoach();
 }

 async function demanderRdv() {
  const date = document.getElementById('demandeDate').value;
  if (!date) { alert('Choisis une date et une heure.'); return; }
  if (new Date(date) < new Date()) { alert('Choisis une date dans le futur.'); return; }
  const { data: { user } } = await sb.auth.getUser();
  if (erreur(await sb.from('demandes_rdv').insert({ client_id: user.id, date_demandee: new Date(date).toISOString() }))) return;
  alert('Demande envoyée. Le coach va te répondre.');
  demarrer();
 }

 async function accepterDemande(id) {
  const { data: d } = await sb.from('demandes_rdv').select('*').eq('id', id).single();
  if (erreur(await sb.from('rendez_vous').insert({ client_id: d.client_id, date_rdv: d.date_demandee }))) return;
  if (erreur(await sb.from('demandes_rdv').update({ statut: 'accepte' }).eq('id', id))) return;
  afficherCoach();
 }

 async function refuserDemande(id) {
  if (!confirm('Refuser cette demande ?')) return;
  if (erreur(await sb.from('demandes_rdv').update({ statut: 'refuse' }).eq('id', id))) return;
  afficherCoach();
 }

 async function ajouterRdv() {
  const clientId = document.getElementById('rdvClient').value;
  const date = document.getElementById('rdvDate').value;
  if (!clientId || !date) { alert('Choisis un client et une date.'); return; }
  await sb.from('rendez_vous').insert({ client_id: clientId, date_rdv: new Date(date).toISOString() });
  document.getElementById('rdvDate').value = '';
  afficherCoach();
 }

 async function rdvFait(rdvId, clientId) {
  await pointer(clientId);
  await sb.from('rendez_vous').update({ fait: true }).eq('id', rdvId);
  afficherCoach();
 }

 async function annulerRdv(id) {
  if (!confirm('Annuler ce rendez-vous ?')) return;
  await sb.from('rendez_vous').delete().eq('id', id);
  afficherCoach();
 }

 demarrer();
</script>
</body>
</html>
